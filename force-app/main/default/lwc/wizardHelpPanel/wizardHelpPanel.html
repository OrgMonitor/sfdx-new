<template>
    <div class="whp-card" aria-labelledby="whp-title">
        <h3 id="whp-title" class="whp-title">{title}</h3>

        <!-- Illustration placeholder -->
        <div class="whp-illustration" aria-hidden="true">
            <svg viewBox="0 0 120 80" class="whp-svg" aria-hidden="true">
                <!-- Monitor -->
                <rect x="20" y="10" width="80" height="48" rx="4" fill="#e8f5e9" stroke="#0b6e31" stroke-width="1.5"/>
                <rect x="20" y="48" width="80" height="8" rx="0" fill="#c8e6c9"/>
                <rect x="48" y="56" width="24" height="6" fill="#c8e6c9"/>
                <rect x="36" y="62" width="48" height="3" rx="1.5" fill="#a5d6a7"/>
                <!-- Shield icon on screen -->
                <path d="M55 20L45 24v7c0 5.5 4.5 10 10 11 5.5-1 10-5.5 10-11v-7l-10-4z" fill="#0b6e31"/>
                <path d="M53 31l-2.5-2.5 1.2-1.2 1.3 1.3 3.5-3.5 1.2 1.2z" fill="#fff"/>
                <!-- Check badges -->
                <circle cx="85" cy="22" r="7" fill="#0b6e31"/>
                <path d="M82 22l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="85" cy="36" r="7" fill="#0b6e31"/>
                <path d="M82 36l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="85" cy="50" r="7" fill="#0b6e31"/>
                <path d="M82 50l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </div>

        <ul class="whp-list" role="list" aria-label={title}>
            <template for:each={items} for:item="item">
                <li key={item} class="whp-item" role="listitem">
                    <span class="whp-bullet" aria-hidden="true">&bull;</span>
                    <span>{item}</span>
                </li>
            </template>
        </ul>
    </div>
</template>
