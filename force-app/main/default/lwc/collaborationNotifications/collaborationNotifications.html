<template>
 <section aria-label="Collaboration notification setup">
  <template if:true={showSlack}><article class="provider">
   <fieldset class="enablement"><legend>Do you want to send setup-change notifications to Slack?</legend><lightning-input type="toggle" label="Slack notifications" checked={slackEnabled} onchange={handleSlackToggle}></lightning-input><span class="progress" role="status">{slackProgress}</span></fieldset>
   <template if:false={slackEnabled}><p class="skip" role="status">Slack will be skipped. Any existing connection is preserved.</p></template>
   <template if:true={slackEnabled}>
    <div class="before"><strong>Before you begin</strong><p>You must be a Slack Workspace Owner or have permission to create and install Slack apps.</p><p><strong>Estimated setup time:</strong> 5–10 minutes</p><a class="external" href="https://api.slack.com/apps" target="_blank" rel="noopener noreferrer">Open Slack API Apps ↗<span class="assistive"> (opens in a new tab)</span></a></div>
    <div class="setup-layout"><nav class="phase-nav" aria-label="Slack setup progress">
     <button class={slackPhase1Class} data-provider="slack" data-phase="1" onclick={handlePhaseSelect} disabled={slackPhase1Disabled} aria-current={slackPhase1Current}><span>1. Configure Slack app</span><small>{slackPhase1Status}</small></button>
     <button class={slackPhase2Class} data-provider="slack" data-phase="2" onclick={handlePhaseSelect} disabled={slackPhase2Disabled} aria-current={slackPhase2Current}><span>2. Save credentials</span><small>{slackPhase2Status}</small></button>
     <button class={slackPhase3Class} data-provider="slack" data-phase="3" onclick={handlePhaseSelect} disabled={slackPhase3Disabled} aria-current={slackPhase3Current}><span>3. Authorise Slack</span><small>{slackPhase3Status}</small></button>
     <button class={slackPhase4Class} data-provider="slack" data-phase="4" onclick={handlePhaseSelect} disabled={slackPhase4Disabled} aria-current={slackPhase4Current}><span>4. Select channel and test</span><small>{slackPhase4Status}</small></button>
    </nav><div class="phase-panel">
     <template if:true={slackPhase1}><h3 tabindex="-1" data-heading="slack">1. Create and configure the Slack app</h3>
      <h4>A. Copy the callback URL</h4><div class="callback"><lightning-input label="Slack Callback URL" value={slack.callbackUrl} readonly></lightning-input><lightning-button label="Copy URL" data-provider="slack" onclick={copy}></lightning-button></div><p>Slack will return the authorisation result to this Salesforce address. Paste it exactly as displayed.</p>
      <h4>B. Create the Slack app</h4><ol><li>Open <strong>Slack API Apps</strong> and select <strong>Create New App → From scratch</strong>.</li><li>Enter <strong>Org Monitor</strong>, choose the destination workspace, and select <strong>Create App</strong>.</li></ol><a class="button-link" href="https://api.slack.com/apps" target="_blank" rel="noopener noreferrer">Open Slack API Apps ↗<span class="assistive"> (opens in a new tab)</span></a>
      <h4>C. Register the callback</h4><ol><li>Open <strong>OAuth &amp; Permissions → Redirect URLs → Add New Redirect URL</strong>.</li><li>Paste the callback, select <strong>Add</strong>, then <strong>Save URLs</strong>.</li></ol><p class="notice">The callback URL must exactly match the URL displayed by Org Monitor.</p>
      <h4>D. Add Bot Token Scopes</h4><table><thead><tr><th>Bot scope</th><th>Why it is needed</th></tr></thead><tbody><tr><td><code>chat:write</code></td><td>Send messages</td></tr><tr><td><code>channels:read</code></td><td>List public channels</td></tr><tr><td><code>groups:read</code></td><td>List private channels when enabled</td></tr></tbody></table><p>Add these under <strong>Bot Token Scopes</strong>, not User Token Scopes.</p><lightning-input type="checkbox" label="Include private Slack channels" checked={privateSlackChannels} onchange={handlePrivateChannels}></lightning-input><p>This requires <code>groups:read</code>. A channel member must invite the app before it can post.</p><div class="warning"><strong>Org Monitor does not read message history.</strong><p>Do not add channel-history or message-read scopes. Invite the app to the destination channel.</p></div><lightning-button variant="brand" label="I have configured the Slack app — Continue" data-provider="slack" data-next="2" onclick={continuePhase}></lightning-button>
     </template>
     <template if:true={slackPhase2}><h3 tabindex="-1" data-heading="slack">2. Save the Slack application credentials</h3><ol><li>Open <strong>Basic Information → App Credentials</strong>.</li><li>Copy the Client ID and Client Secret and enter them below.</li></ol><template if:true={slack.secureConfigured}><p class="success">Slack application credentials are securely configured. Masked characters indicate saved values; select a field to enter replacement credentials.</p></template><div class="fields"><lightning-input label="Slack Client ID" data-field="slackClientId" value={slackClientId} onfocus={handleCredentialFocus} onchange={handleInput} field-level-help="Numeric Client ID from Slack App Credentials" required></lightning-input><lightning-input type="password" label="Slack Client Secret" data-field="slackSecret" value={slackSecret} autocomplete="new-password" onfocus={handleCredentialFocus} onchange={handleInput} field-level-help="Accepted once and never displayed again" required></lightning-input></div><p class="security">Your Client Secret is submitted to Salesforce secure credential storage. The masked value is only a placeholder; Org Monitor never reads or displays the saved secret.</p><lightning-button variant="brand" label="Save Slack Configuration" onclick={saveSlack} disabled={slackSaveDisabled}></lightning-button></template>
     <template if:true={slackPhase3}><h3 tabindex="-1" data-heading="slack">3. Authorise Org Monitor in Slack</h3><p>Connect Org Monitor to the workspace selected when you created the app.</p><div class="account-card"><strong>Waiting for Slack authorisation</strong><p>Complete authorisation in the newly opened tab, select Allow, then return here.</p></div><div class="actions"><lightning-button variant="brand" label="Connect Slack" data-provider="slack" onclick={connect} disabled={slackConnectDisabled}></lightning-button><lightning-button label="Check Connection" data-provider="slack" onclick={verify} disabled={slackCheckDisabled}></lightning-button></div><p class="status" aria-live="polite"><strong>Authentication status:</strong> {slackStatus}</p></template>
     <template if:true={slackPhase4}><h3 tabindex="-1" data-heading="slack">4. Select the destination channel</h3><div class="success"><strong>Connected successfully</strong><dl class="identity"><dt>Workspace</dt><dd>{slack.identity}</dd><dt>Workspace ID</dt><dd>{slack.identityId}</dd></dl></div><lightning-combobox label="Destination Slack channel" value={slack.channelId} options={slack.options} onchange={handleSlackChannel} required></lightning-combobox><template if:true={slack.channelId}><div class="warning"><strong>Add Org Monitor to this channel</strong><p>Open {slackChannelName} in Slack and enter <code>/invite @Org Monitor</code>.</p></div></template><lightning-button variant="brand" label="Send Test Message" data-provider="slack" onclick={test} disabled={slackCanTest}></lightning-button><template if:true={slack.testSucceeded}><p class="success"><strong>Slack setup complete</strong><br>A test notification was delivered successfully to #{slackChannelName}.</p></template></template>
     <template if:true={slack.error}><p class="error" role="alert">{slack.error}</p></template>
    </div></div><template if:true={slack.connected}><section class="management"><h3>Connection management</h3><div class="actions"><lightning-button label="Reconnect" data-provider="slack" onclick={connect}></lightning-button><lightning-button variant="destructive-text" label="Disconnect" data-provider="slack" onclick={disconnect}></lightning-button></div></section></template>
   </template>
  </article></template>

  <template if:true={showMicrosoft}><article class="provider">
   <fieldset class="enablement"><legend>Do you want to send setup-change notifications to Microsoft Teams?</legend><lightning-input type="toggle" label="Microsoft Teams notifications" checked={microsoftEnabled} onchange={handleMicrosoftToggle}></lightning-input><span class="progress" role="status">{microsoftProgress}</span></fieldset>
   <template if:false={microsoftEnabled}><p class="skip" role="status">Microsoft Teams will be skipped. Any existing connection is preserved.</p></template>
   <template if:true={microsoftEnabled}>
    <div class="before"><strong>Before you begin</strong><p>You must be able to create Microsoft Entra app registrations. You may need assistance from your Microsoft 365 or Entra administrator.</p><p><strong>Estimated setup time:</strong> 10–15 minutes</p></div>
    <div class="setup-layout"><nav class="phase-nav" aria-label="Microsoft Teams setup progress"><button class={microsoftPhase1Class} data-provider="microsoft" data-phase="1" onclick={handlePhaseSelect} disabled={microsoftPhase1Disabled} aria-current={microsoftPhase1Current}><span>1. Register application</span><small>{microsoftPhase1Status}</small></button><button class={microsoftPhase2Class} data-provider="microsoft" data-phase="2" onclick={handlePhaseSelect} disabled={microsoftPhase2Disabled} aria-current={microsoftPhase2Current}><span>2. Configure permissions</span><small>{microsoftPhase2Status}</small></button><button class={microsoftPhase3Class} data-provider="microsoft" data-phase="3" onclick={handlePhaseSelect} disabled={microsoftPhase3Disabled} aria-current={microsoftPhase3Current}><span>3. Save and authorise</span><small>{microsoftPhase3Status}</small></button><button class={microsoftPhase4Class} data-provider="microsoft" data-phase="4" onclick={handlePhaseSelect} disabled={microsoftPhase4Disabled} aria-current={microsoftPhase4Current}><span>4. Select destination and test</span><small>{microsoftPhase4Status}</small></button></nav><div class="phase-panel">
     <template if:true={microsoftPhase1}><h3 tabindex="-1" data-heading="microsoft">1. Register the Microsoft application</h3><h4>A. Copy the callback URL</h4><div class="callback"><lightning-input label="Microsoft Callback URL" value={microsoft.callbackUrl} readonly></lightning-input><lightning-button label="Copy URL" data-provider="microsoft" onclick={copy}></lightning-button></div><p>Microsoft returns the authorisation result to this Salesforce address.</p><h4>B. Create the application</h4><ol><li>Open the Entra admin center and go to <strong>Identity → Applications → App registrations</strong>.</li><li>Select <strong>New registration</strong>, enter <strong>Org Monitor</strong>, select single-tenant accounts, leave Redirect URI blank, and register.</li></ol><a class="button-link" href="https://entra.microsoft.com/" target="_blank" rel="noopener noreferrer">Open Microsoft Entra Admin Center ↗<span class="assistive"> (opens in a new tab)</span></a><h4>C. Copy application details</h4><p>From Overview, copy the Application (client) ID and Directory (tenant) ID for Phase 3.</p><h4>D. Register the callback</h4><ol><li>Select <strong>Authentication → Add a platform → Web</strong>.</li><li>Paste the callback URL and save.</li></ol><p class="notice">The redirect URI must exactly match the URL displayed by Org Monitor.</p><lightning-button variant="brand" label="I have registered the application — Continue" data-provider="microsoft" data-next="2" onclick={continuePhase}></lightning-button></template>
     <template if:true={microsoftPhase2}><h3 tabindex="-1" data-heading="microsoft">2. Configure Microsoft Graph permissions</h3><p>Select <strong>API permissions → Add a permission → Microsoft Graph → Delegated permissions</strong>, then add every permission below.</p><table><thead><tr><th>Delegated permission</th><th>Why it is needed</th></tr></thead><tbody><tr><td><code>User.Read</code></td><td>Verify the identity</td></tr><tr><td><code>Team.ReadBasic.All</code></td><td>List Teams</td></tr><tr><td><code>Channel.ReadBasic.All</code></td><td>List channels</td></tr><tr><td><code>ChannelMessage.Send</code></td><td>Send notifications</td></tr><tr><td><code>openid</code></td><td>Identify the user</td></tr><tr><td><code>offline_access</code></td><td>Maintain the connection</td></tr></tbody></table><div class="warning"><strong>Select Delegated permissions, not Application permissions.</strong><p>Do not add Teamwork.Migrate.All or migration-only permissions.</p></div><h4>Grant consent</h4><p>Select <strong>Grant admin consent for [Organisation]</strong> if required. Ask your Entra administrator if you cannot grant it.</p><h4>Create the client secret</h4><ol><li>Select <strong>Certificates &amp; secrets → Client secrets → New client secret</strong>.</li><li>Enter <strong>Org Monitor Salesforce Connection</strong>, choose an expiry, add it, and immediately copy the value.</li></ol><div class="warning"><strong>Copy the Client Secret Value, not the Secret ID.</strong><p>Microsoft displays it only once. Reconfigure Org Monitor when it expires.</p></div><lightning-button variant="brand" label="I have configured permissions and created the secret — Continue" data-provider="microsoft" data-next="3" onclick={continuePhase}></lightning-button></template>
     <template if:true={microsoftPhase3}><h3 tabindex="-1" data-heading="microsoft">3. Save the configuration and authorise Microsoft Teams</h3><template if:true={microsoft.secureConfigured}><p class="success">Microsoft application credentials are securely configured. Masked characters indicate saved values; select a field to enter replacement credentials.</p></template><div class="fields"><lightning-input label="Directory / Tenant ID" data-field="tenantId" value={tenantId} onchange={handleInput} required></lightning-input><lightning-input label="Application / Client ID" data-field="microsoftClientId" value={microsoftClientId} onfocus={handleCredentialFocus} onchange={handleInput} required></lightning-input><lightning-input type="password" label="Client Secret Value" data-field="microsoftSecret" value={microsoftSecret} autocomplete="new-password" onfocus={handleCredentialFocus} onchange={handleInput} required></lightning-input></div><p class="security">The masked value is only a placeholder. The secret is sent only to Salesforce secure credential storage; Org Monitor never reads or displays the saved secret.</p><div class="actions"><lightning-button variant="brand" label="Save Microsoft Configuration" onclick={saveMicrosoft} disabled={microsoftSaveDisabled}></lightning-button><template if:true={microsoft.secureConfigured}><lightning-button variant="brand" label="Connect Microsoft Teams" data-provider="microsoft" onclick={connect} disabled={microsoftConnectDisabled}></lightning-button><lightning-button label="Check Connection" data-provider="microsoft" onclick={verify} disabled={microsoftCheckDisabled}></lightning-button></template></div><div class="account-card"><strong>Use an account that remains active, is licensed for Teams, belongs to the destination Team, and can post there.</strong><p>A dedicated integration account is recommended. Complete OAuth in the new tab, then return here.</p></div><p class="status"><strong>Authentication status:</strong> {microsoftStatus}</p></template>
     <template if:true={microsoftPhase4}><h3 tabindex="-1" data-heading="microsoft">4. Select the Team and channel</h3><div class="success"><strong>Connected successfully</strong><dl class="identity"><dt>Microsoft identity</dt><dd>{microsoft.identity}</dd><dt>Tenant / identity ID</dt><dd>{microsoft.identityId}</dd></dl></div><lightning-combobox label="Microsoft Team" value={microsoft.teamId} options={microsoft.teamOptions} onchange={handleTeam} required></lightning-combobox><lightning-combobox label="Destination channel" value={microsoft.channelId} options={microsoft.options} onchange={handleMicrosoftChannel} disabled={microsoftChannelDisabled} required></lightning-combobox><lightning-button variant="brand" label="Send Test Message" data-provider="microsoft" onclick={test} disabled={microsoftCanTest}></lightning-button><template if:true={microsoft.testSucceeded}><p class="success"><strong>Microsoft Teams setup complete</strong><br>A test notification was delivered successfully to {microsoftTeamName} → {microsoftChannelName}.</p></template></template><template if:true={microsoft.error}><p class="error" role="alert">{microsoft.error}</p></template>
    </div></div><template if:true={microsoft.connected}><section class="management"><h3>Connection management</h3><div class="actions"><lightning-button label="Reconnect" data-provider="microsoft" onclick={connect}></lightning-button><lightning-button variant="destructive-text" label="Disconnect" data-provider="microsoft" onclick={disconnect}></lightning-button></div></section></template>
   </template>
  </article></template>
 </section>
</template>
