<template>
    <main class="workspace" aria-live="polite">
        <template if:true={loading}><lightning-spinner alternative-text="Loading deployment windows" size="medium"></lightning-spinner></template>
        <template if:true={errorMessage}><div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{errorMessage}</div></template>
        <template if:true={isListView}>
            <header class="page-header"><div><p class="eyebrow">Release Governance</p><h1>Deployment Windows</h1><p>Define and manage authorised periods for Salesforce releases.</p></div><template if:true={capabilities.canManage}><lightning-button variant="brand" label="New Deployment Window" onclick={openNew}></lightning-button></template></header>
            <section class="summary-grid" aria-label="Deployment window summary">
                <article><span>Current window</span><strong class="open-text">{currentWindowLabel}</strong><small>{currentWindowReference}</small></article>
                <article><span>Current window ends</span><template if:true={currentWindow}><strong><lightning-formatted-date-time value={currentWindow.endDateTime} hour="numeric" minute="2-digit"></lightning-formatted-date-time></strong><small>{capabilities.timeZone}</small></template><template if:false={currentWindow}><strong>—</strong></template></article>
                <article><span>Next scheduled window</span><template if:true={nextWindow}><strong><lightning-formatted-date-time value={nextWindow.startDateTime} day="2-digit" month="long"></lightning-formatted-date-time></strong><small><lightning-formatted-date-time value={nextWindow.startDateTime} hour="numeric" minute="2-digit"></lightning-formatted-date-time>–<lightning-formatted-date-time value={nextWindow.endDateTime} hour="numeric" minute="2-digit"></lightning-formatted-date-time></small></template><template if:false={nextWindow}><strong>—</strong></template></article>
            </section>
            <section class="list-panel" aria-labelledby="window-list-heading">
                <div class="view-tabs" role="tablist" aria-label="Deployment window views"><button role="tab" aria-selected={isCurrent} class={currentTabClass} data-view="CURRENT" onclick={switchView}>Current &amp; Upcoming</button><button role="tab" aria-selected={isPast} class={pastTabClass} data-view="PAST" onclick={switchView}>Past Windows</button></div>
                <header class="list-heading"><h2 id="window-list-heading">{listTitle}</h2><p>{recordCountLabel}</p></header>
                <template if:true={hasRecords}><div class="table-scroll"><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Deployment Window</th><th scope="col">Schedule</th><th scope="col">Owner</th><th scope="col">Approved By</th><th scope="col">Status</th><th scope="col">Release Runsheet</th><th scope="col"><span class="assistive">Actions</span></th></tr></thead><tbody><template for:each={records} for:item="row"><tr key={row.id}>
                    <th scope="row"><a class="record-link" href={row.recordUrl} data-id={row.id} onclick={navigateToRecord}>{row.name}</a><small>{row.ticketReference}</small></th>
                    <td><lightning-formatted-date-time value={row.startDateTime} day="2-digit" month="short" year="numeric" hour="numeric" minute="2-digit"></lightning-formatted-date-time>–<lightning-formatted-date-time value={row.endDateTime} hour="numeric" minute="2-digit"></lightning-formatted-date-time><small>{capabilities.timeZone}</small></td>
                    <td>{row.ownerName}</td><td>{row.approvedByName}</td><td><span class={row.statusClass}>{row.statusLabel}</span></td>
                    <td><template if:true={row.releaseRunsheetUrl}><a href={row.releaseRunsheetUrl} target="_blank" rel="noopener noreferrer">Open Runsheet ↗<span class="assistive"> (opens in a new tab)</span></a></template></td><td><lightning-button label="View" data-id={row.id} onclick={navigateToRecord}></lightning-button></td>
                </tr></template></tbody></table></div></template>
                <template if:false={hasRecords}><template if:false={loading}><div class="empty-state"><h2>{emptyTitle}</h2><p>{emptyMessage}</p></div></template></template>
            </section>
        </template>
        <template if:true={isDetailView}>
            <header class="detail-titlebar"><div><p class="eyebrow">Deployment Window</p><h1>{detail.name}</h1><p>Ticket Reference: {detail.ticketReference}</p></div><div class="detail-actions"><span class={detail.statusClass}>{detail.statusLabel}</span><template if:true={detail.canApproveRequest}><lightning-button variant="brand" label="Approve" data-action="approve" onclick={confirmFromDetail}></lightning-button></template><template if:true={detail.canRejectRequest}><lightning-button label="Reject" data-action="reject" onclick={confirmFromDetail}></lightning-button></template><template if:true={detail.canSubmit}><lightning-button variant="brand" label="Submit for Approval" data-action="submit" onclick={confirmFromDetail}></lightning-button></template><template if:true={detail.canEdit}><lightning-button label="Edit" onclick={editFromDetail}></lightning-button></template><template if:true={detail.canClose}><lightning-button variant="brand" label="Close Window" data-action="close" onclick={confirmFromDetail}></lightning-button></template><template if:true={hasMoreActions}><lightning-button-menu alternative-text="More deployment window actions" menu-alignment="right" onselect={handleMoreAction}><template if:true={detail.canActivate}><lightning-menu-item value="activate" label="Activate"></lightning-menu-item></template><template if:true={detail.canCancel}><lightning-menu-item value="cancel" label="Cancel Window"></lightning-menu-item></template></lightning-button-menu></template></div></header>
            <section class="detail-facts" aria-label="Deployment window facts"><div><span>Schedule</span><strong><lightning-formatted-date-time value={detail.startDateTime} day="2-digit" month="short" year="numeric" hour="numeric" minute="2-digit"></lightning-formatted-date-time>–<lightning-formatted-date-time value={detail.endDateTime} hour="numeric" minute="2-digit"></lightning-formatted-date-time></strong><small>{capabilities.timeZone}</small></div><div><span>Owner</span><strong>{detail.ownerName}</strong></div><div><span>Requested By</span><strong>{detail.requestedByName}</strong></div><div><span>Approved By</span><strong>{detail.approvedByName}</strong></div></section>
            <div class="detail-layout"><div><section class="content-panel"><h2>Release Details</h2><div><span>Description / Purpose</span><p>{detail.description}</p></div></section><section class="content-panel authorised-detail"><h2>Authorised Deployment Users</h2><template if:true={hasAuthorisedUsers}><table class="slds-table slds-table_cell-buffer"><caption class="assistive">Users authorised to perform work during this deployment window</caption><thead><tr><th scope="col">User name</th><th scope="col">Deployment role</th></tr></thead><tbody><template for:each={detail.authorisedUsers} for:item="user"><tr key={user.userId}><th scope="row">{user.userName}</th><td>{user.deploymentRole}</td></tr></template></tbody></table></template><template if:false={hasAuthorisedUsers}><p>No authorised deployment users are configured.</p></template></section><section class="content-panel"><h2>Release Runsheet</h2><div class="runsheet"><div><strong>{runsheetTitle}</strong><p>External release documentation</p></div><template if:true={detail.releaseRunsheetUrl}><a class="slds-button slds-button_neutral" href={detail.releaseRunsheetUrl} target="_blank" rel="noopener noreferrer">Open Runsheet ↗<span class="assistive"> (opens in a new tab)</span></a></template></div></section></div><aside><section class="content-panel"><h2>Release Information</h2><dl><dt>Ticket Reference</dt><dd>{detail.ticketReference}</dd><dt>Status</dt><dd><span class={detail.statusClass}>{detail.statusLabel}</span></dd><dt>Window Record</dt><dd>{detail.name}</dd></dl></section><section class="content-panel"><h2>Approval</h2><div class={approvalClass}><strong>{approvalLabel}</strong></div></section></aside></div>
        </template>
    </main>
    <template if:true={modalOpen}><section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open" onkeydown={handleModalKeydown}><div class="slds-modal__container"><header class="slds-modal__header"><lightning-button-icon class="slds-modal__close" icon-name="utility:close" alternative-text="Close" onclick={closeModal} disabled={saving}></lightning-button-icon><h2 id="modal-heading" class="modal-heading" tabindex="-1">{modalTitle}</h2></header><div class="slds-modal__content slds-p-around_large">
        <template if:true={isFormModal}><p class="required-note">* Required information</p><template if:true={formError}><div class="error-summary" role="alert" tabindex="-1" data-error-summary>{formError}</div></template><form onsubmit={save} novalidate>
            <fieldset><legend>Release Details</legend><div class="form-grid"><lightning-input data-form-input data-field="ticketReference" label="Ticket Reference" value={form.ticketReference} maxlength="255" required onchange={handleFormInput}></lightning-input><div class="lookup"><lightning-input type="search" data-user-type="owner" label="Owner" value={form.ownerName} onchange={handleUserSearch}></lightning-input><template for:each={ownerOptions} for:item="option"><button type="button" class="lookup-option" key={option.id} data-id={option.id} data-user-type="owner" onclick={selectUser}>{option.label}</button></template></div></div><lightning-textarea data-form-input data-field="description" label="Description / Purpose" value={form.description} maxlength="32000" required onchange={handleFormInput}></lightning-textarea><lightning-input data-form-input data-field="releaseRunsheetUrl" type="url" label="Release Runsheet" value={form.releaseRunsheetUrl} onchange={handleFormInput} placeholder="https://"></lightning-input></fieldset>
            <fieldset><legend>Schedule</legend><div class="schedule-grid"><lightning-input data-form-input data-field="startDate" type="date" label="Start Date" value={form.startDate} required onchange={handleFormInput}></lightning-input><lightning-input data-form-input data-field="startTime" type="time" label="Start Time" value={form.startTime} required onchange={handleFormInput}></lightning-input><lightning-input data-form-input data-field="endDate" type="date" label="End Date" value={form.endDate} required onchange={handleFormInput}></lightning-input><lightning-input data-form-input data-field="endTime" type="time" label="End Time" value={form.endTime} required onchange={handleFormInput}></lightning-input></div></fieldset>
            <fieldset aria-describedby="authorised-users-help authorised-users-error" aria-invalid={authorisedUsersInvalid}><legend>Authorised Deployment Users <span aria-hidden="true">*</span><span class="assistive">, required</span></legend><p id="authorised-users-help" class="section-help">Add at least one active Salesforce user and assign a deployment role.</p><template if:true={authorisedUsersInvalid}><p id="authorised-users-error" class="field-error" role="alert">{formError}</p></template><div class="lookup"><lightning-input data-authorised-search type="search" label="Add Salesforce User" value={authorisedUserSearch} aria-autocomplete="list" aria-controls="authorised-user-results" aria-expanded={authorisedResultsExpanded} onchange={handleAuthorisedUserSearch} onkeydown={handleLookupKeydown}></lightning-input><div id="authorised-user-results" role="listbox" aria-label="Matching active Salesforce users"><template for:each={authorisedUserOptions} for:item="option"><button type="button" role="option" aria-selected="false" class="lookup-option" key={option.id} data-authorised-option data-id={option.id} onclick={addAuthorisedUser} onkeydown={handleLookupOptionKeydown}>{option.label}</button></template></div></div><template for:each={form.authorisedUsers} for:item="user"><div class="authorised-user-row" key={user.userId}><div class="authorised-user-name"><strong>{user.userName}</strong></div><lightning-combobox data-user-id={user.userId} data-field="deploymentRole" label="Deployment Role" value={user.deploymentRole} options={roleOptions} required onchange={updateAuthorisedUser}></lightning-combobox><lightning-input data-user-id={user.userId} data-field="notes" label="Notes" value={user.notes} maxlength="1000" onchange={updateAuthorisedUser}></lightning-input><lightning-button-icon icon-name="utility:delete" alternative-text={user.removeLabel} title={user.removeLabel} data-user-id={user.userId} onclick={removeAuthorisedUser}></lightning-button-icon></div></template></fieldset>
            <fieldset><legend>Request and Approval</legend><div class="form-grid"><lightning-input label="Status" value={formStatusLabel} disabled></lightning-input><div></div><div class="lookup"><lightning-input type="search" data-user-type="requester" label="Requested By" value={form.requestedByName} onchange={handleUserSearch}></lightning-input><template for:each={requesterOptions} for:item="option"><button type="button" class="lookup-option" key={option.id} data-id={option.id} data-user-type="requester" onclick={selectUser}>{option.label}</button></template></div><lightning-input label="Approved By" value={formApprovedBy} disabled></lightning-input></div></fieldset>
        </form></template><template if:true={isConfirmModal}><template if:true={formError}><div class="error-summary" role="alert">{formError}</div></template><p>Confirm <strong>{transitionLabel}</strong> for {detail.name}.</p></template></div><footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={closeModal} disabled={saving}></lightning-button><template if:true={isFormModal}><lightning-button variant="brand" label="Save" onclick={save} disabled={saving}></lightning-button></template><template if:true={isConfirmModal}><lightning-button variant="brand" label="Confirm" onclick={confirmTransition} disabled={saving}></lightning-button></template></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
</template>
